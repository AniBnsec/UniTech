<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AegisTrust Guard</title>
  <style>
    body {
      width: 360px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #070b14;
      color: #e2e8f0;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .title {
      font-weight: 800;
      font-size: 15px;
      color: #fff;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      background: #083344;
      color: #06b6d4;
      border: 1px solid #0e7490;
      font-weight: bold;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 8px;
      background: #0b1329;
      border: 1px solid #1e293b;
      color: #fff;
      font-size: 12px;
      outline: none;
      margin-bottom: 10px;
      font-family: monospace;
    }
    input:focus {
      border-color: #00f0ff;
    }
    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #000;
      font-weight: 700;
      border: none;
      font-size: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn:hover {
      opacity: 0.9;
    }
    #result {
      margin-top: 12px;
      display: none;
      padding: 12px;
      border-radius: 8px;
      background: #0b1329;
      border: 1px solid #1e293b;
      font-size: 12px;
    }
    .score-badge {
      display: inline-block;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      margin-bottom: 6px;
    }
    .critical { background: #450a0a; color: #fca5a5; border: 1px solid #991b1b; }
    .safe { background: #022c22; color: #6ee7b7; border: 1px solid #065f46; }
    .footer {
      margin-top: 12px;
      font-size: 10px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">🛡️ Aegis<span style="color:#00f0ff">Trust</span></div>
    <span class="badge">EVM + AI</span>
  </div>

  <input type="text" id="urlInput" placeholder="Inspect link before clicking..." />
  <button class="btn" id="scanBtn">Investigate Link</button>

  <div id="result">
    <div id="riskBadge" class="score-badge"></div>
    <div id="verdict" style="font-weight:bold; color:#fff; margin-bottom:4px;"></div>
    <div id="explanation" style="color:#94a3b8; font-size:11px; line-height:1.4;"></div>
    <div id="proof" style="margin-top:8px; font-family:monospace; font-size:10px; color:#00f0ff;"></div>
  </div>

  <div class="footer">
    AegisTrust Pre-Navigation Link Protection
  </div>

  <script src="popup.js"></script>
</body>
</html>
